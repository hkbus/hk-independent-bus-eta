name = "hkbus-sync"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Create with: wrangler kv namespace create SYNC_KV
# then replace the id below with the one it prints.
kv_namespaces = [
  { binding = "SYNC_KV", id = "8f154ddc978546c2953d37e6a32c98ef" }
]

[vars]
# Comma-separated list of origins allowed to call this API.
ALLOWED_ORIGINS = "https://hkbus.app,https://alpha.hkbus.app"
